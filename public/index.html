*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);

  font-weight:400;font-size:17px;line-height:1.9;letter-spacing:.03em;
  font-feature-settings:"palt" 1;line-break:strict;word-break:auto-phrase;-webkit-font-smoothing:antialiased;}
p{margin:0;} button{font:inherit;color:inherit;letter-spacing:inherit;}
b{font-weight:600;font-family:var(--num);font-feature-settings:"lnum" 1;letter-spacing:0;}

.hero{position:relative;container-type:inline-size;max-width:560px;margin:0 auto;line-height:0;--u:min(1vw,5.6px);background:var(--tb);}
.hero img{width:100%;height:auto;display:block;}
.hero h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0;}
.season{position:absolute;left:calc(8.6*var(--u));top:calc(46.6*var(--u));color:var(--paper);line-height:1;white-space:nowrap;}
.season b{display:block;font-size:calc(11.2*var(--u));line-height:.9;}
.season .sw{display:block;margin-top:calc(1.4*var(--u));font-family:var(--num);font-weight:600;font-size:max(15px,calc(3.85*var(--u)));letter-spacing:.04em;line-height:1.3;}
.wrap{max-width:560px;margin:0 auto;padding:0 24px 56px;}
section{margin-top:44px;padding-top:26px;border-top:1px solid var(--tb);}
.hero + .wrap section:first-child{margin-top:34px;border-top:0;padding-top:0;}
.sec-label{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.4;letter-spacing:.06em;margin-bottom:18px;}
.sec-num,.tn{display:none;}

.recs{display:grid;gap:0;}
.rec{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(124,96,68,.45);padding:14px 0;cursor:pointer;}
.rec:first-child{border-top:0;padding-top:0;}
.rec img{width:118px;height:138px;object-fit:cover;display:block;}
.rec-tag{font-size:15px;color:var(--tbd);letter-spacing:.1em;line-height:1.4;}
.rec-tag{display:flex;flex-wrap:wrap;column-gap:1.1em;} .rec-tag span{white-space:nowrap;}

.code{font-size:15px;line-height:1;margin-top:8px;white-space:nowrap;}
.code b{font-size:42px;margin-left:2px;}
.color2{font-size:15px;line-height:1.5;margin-top:8px;}
.base{display:none;}
.price{font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;}
.price .unit{margin-left:1px;}

.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tab{font-size:15px;line-height:1.4;padding:9px 12px;border:1px solid var(--tb);background:none;border-radius:0;cursor:pointer;}
.tab .n{margin-left:6px;font-size:13px;color:var(--mut);}
.tab[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper);}
.tab[aria-selected="true"] .n{color:var(--paper);}
.kakaku{font-size:15px;line-height:1.9;margin-top:14px;}
.toc{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:18px;}
.toc button{position:relative;font-size:15px;line-height:1.6;background:none;border:0;border-bottom:1px solid var(--tb);padding:2px 0;cursor:pointer;}
.toc button::after{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px;}
.toc .tc{margin-left:6px;font-size:13px;color:var(--mut);}
#list .sec-label{font-size:20px;margin:34px 0 8px;scroll-margin-top:12px;}
.lead{margin-bottom:18px;}
.runnote{display:none;}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;align-items:start;}
.card2{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0;}
.phwrap{position:relative;line-height:0;}
.ph{width:100%;aspect-ratio:6/7;object-fit:cover;display:block;}
.zoom{position:absolute;right:6px;bottom:6px;width:26px;height:26px;background:var(--paper);display:flex;align-items:center;justify-content:center;}
.zoom svg{fill:var(--ink);}
.card2.open .phwrap{outline:2px solid var(--ink);outline-offset:2px;}
.flag{display:block;font-size:15px;color:var(--tbd);line-height:1.5;margin-top:4px;}
.more{grid-column:1/-1;min-width:0;padding:18px 0 14px;border-top:1px solid rgba(124,96,68,.45);border-bottom:1px solid rgba(124,96,68,.45);}
.more[hidden]{display:none;}
.stage{width:100%;aspect-ratio:6/7;object-fit:cover;display:block;}
.stage.kiji{object-fit:contain;background:var(--paper,#ece6d8);}
.more .code{margin-top:14px;margin-bottom:8px;} .more .code b{font-size:27px;} .more .code .cn{margin-left:10px;}
.more-close{display:inline-block;margin-top:8px;padding:8px 0;background:none;border:0;font:inherit;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.note,.spec,.maker,.thumb-cap{font-size:15px;line-height:1.8;}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px;}
.thumb{padding:0;border:1px solid transparent;background:none;line-height:0;cursor:pointer;}
.thumb[aria-pressed="true"]{border-color:var(--ink);}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.thumb img.kiji{object-fit:contain;background:var(--paper,#ece6d8);}
.imgna{aspect-ratio:6/7;background:#dcd3c3;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);line-height:1.4;}
.thumb .imgna{aspect-ratio:1;}

footer{margin-top:48px;}
.linkbox{display:flex;justify-content:space-between;align-items:center;background:var(--ai);color:var(--paper);text-decoration:none;padding:16px 18px;

.linkbox::after{content:"";width:10px;height:10px;border-top:2px solid var(--paper);border-right:2px solid var(--paper);transform:rotate(45deg);margin-right:4px;}
.foot-band{display:block;width:100%;margin:14px 0 0;height:auto;}
.foot-msg{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
.foot-note,.legend{font-size:15px;line-height:1.8;margin-top:14px;}
.legend,.foot-note+.foot-note{margin-top:2px;}

section[hidden]{display:none;}

  return im;
}
const ZOOM = '<svg width="13" height="13" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Zm112,0a8,8,0,0,1-8,8H120v24a8,8,0,0,1-16,0V120H80a8,8,0,0,1,0-16h24V80a8,8,0,0,1,16,0v24h24A8,8,0,0,1,152,112Z"/></svg>';
const el = (t,c,x) => { const e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e; };

document.getElementById("season").innerHTML = SEASON.replace(/^(\d+)\s*(.*)$/, (m,y,r)=>'<b>'+y+'</b><span class="sw">'+r.split(" / ").map((t,i,a)=>'<span>'+t+(i<a.length-1?' /':'')+'</span>').join(" ")+'</span>');

const tabsEl = document.getElementById("tabs");
const listEl = document.getElementById("list");
const count = tab => tab.groups.reduce((s,g)=>s+g.items.length,0);

TABS.forEach((tab,i)=>{
  const b = el("button","tab");
  b.type="button"; b.setAttribute("role","tab");
  b.setAttribute("aria-selected", i===0 ? "true":"false");
  b.appendChild(document.createTextNode(tab.label));
  b.appendChild(el("span","n", count(tab) + "点"));
  b.addEventListener("click", ()=>select(i, true));
  tabsEl.appendChild(b);
});

function select(i, keepScroll){
  [...tabsEl.children].forEach((b,j)=>b.setAttribute("aria-selected", i===j ? "true":"false"));
  render(TABS[i], keepScroll);
  try{ history.replaceState(null,"","#"+TABS[i].id); }catch(e){}
}

function render(tab, keepScroll){
  listEl.textContent = "";

  if(tab.groups.length > 1){
    const toc = el("div","toc");
    tab.groups.forEach((g,gi)=>{
      const b = el("button"); b.type="button";
      b.appendChild(el("span","tn", String(gi+1).padStart(2,"0")));
      b.appendChild(el("span",null,(g.name || tab.label)));
      b.appendChild(el("span","tc", g.items.length + "点"));
      b.addEventListener("click", ()=>{
        const t = document.getElementById("g" + gi);
        if(t) t.scrollIntoView({block:"start"});
      });
      toc.appendChild(b);
    });
    listEl.appendChild(toc);
  }

  tab.groups.forEach((g,gi)=>{
    const lab = el("div","sec-label");
    lab.id = "g" + gi;
    lab.appendChild(el("span","sec-num", String(gi+1).padStart(2,"0")));
    lab.appendChild(el("span",null, g.name || tab.label));
    listEl.appendChild(lab);

    const lead = LEADS[tab.id + "/" + g.name];
    if(lead) listEl.appendChild(el("p","lead", lead));

    const grid = el("div","grid2");
    let i = 0;
    while(i < g.items.length){
      let j = i;
      while(j+1 < g.items.length && g.items[j+1].d === g.items[i].d) j++;
      const run = g.items.slice(i, j+1);
      if(run.length >= 2){
        const p = el("p","note runnote", run[0].d);
        p.style.gridColumn = "1 / -1";
        grid.appendChild(p);
      }
      run.forEach(it=>grid.appendChild(compact(it, true)));
      i = j+1;
    }
    listEl.appendChild(grid);
  });
  if(!keepScroll) window.scrollTo({top:0});
}

function thumbs(it, stage){
  const cap = el("p","thumb-cap", VIEWS[0][1]);
  const row = el("div","thumbs");
  VIEWS.forEach(([v,label],i)=>{
    const b = el("button","thumb");
    b.type="button";
    b.setAttribute("aria-pressed", i===0 ? "true":"false");
    b.setAttribute("aria-label", label);
    const im = document.createElement("img");
    im.alt=""; im.loading="lazy"; guard(im); im.src = src(it.c,v); if(v==="kiji") im.className="kiji";
    b.appendChild(im);
    b.addEventListener("click", e=>{
      e.stopPropagation();
      stage.src = src(it.c,v); stage.classList.toggle("kiji", v==="kiji");
      cap.textContent = label;
      [...row.children].forEach((x,k)=>x.setAttribute("aria-pressed", i===k ? "true":"false"));
    });
    row.appendChild(b);
  });
  return {row, cap};
}

function specLine(it){
  return [it.b, it.w, it.p].filter(Boolean).join("／");
}
function specEl(it){
  const p = el("p","spec", specLine(it));
  if(it.y){ const y = el("span","yarn", it.y); y.style.display="block"; p.appendChild(y); }
  return p;
}

function priceEl(it){
  const box = document.createDocumentFragment();
  box.appendChild(el("p","base","基本料金"));
  const pr = el("p","price", yen(it.pr));
  pr.appendChild(el("span","unit", "円（税込）〜"));
  box.appendChild(pr);
  return box;
}


function place(card, panel){
  const top = card.offsetTop; let last = card;
  [...card.parentNode.children].forEach(x=>{ if(x.classList.contains("card2") && Math.abs(x.offsetTop - top) < 4) last = x; });
  last.after(panel);
}

let lastW = innerWidth, rz = 0;
addEventListener("resize", ()=>{
  if(innerWidth === lastW) return;
  lastW = innerWidth; clearTimeout(rz);
  rz = setTimeout(()=>{
    const ops = [...document.querySelectorAll(".card2.open")];
    ops.forEach(c=>c._more.remove());
    const seen = new Set();
    ops.map(c=>[c, c.parentNode.id + "/" + c.offsetTop, c.parentNode]).forEach(([c,k,g])=>{ const key = [...document.querySelectorAll(".grid2")].indexOf(g) + "/" + k; if(seen.has(key)){ c._set(false); return; } seen.add(key); });
    ops.filter(c=>c.classList.contains("open")).forEach(c=>place(c, c._more));
  }, 120);
});

function compact(it, withDesc){
  const box = el("button","card2");
  box.type = "button";
  box.setAttribute("aria-expanded","false");

  const wrap = el("div","phwrap");
  const ph = document.createElement("img");
  ph.className = "ph";
  ph.alt = "ms-" + it.c + (it.n ? " " + it.n : "");
  ph.loading = "lazy";
  guard(ph);
  ph.src = src(it.c,"tatami");
  wrap.appendChild(ph);
  const z = el("span","zoom");
  z.innerHTML = ZOOM;
  wrap.appendChild(z);
  box.appendChild(wrap);

  box.appendChild(el("p","color2", it.n || " "));
  const cd = el("p","code"); cd.innerHTML = 'ms-<b>' + it.c + '</b>'; box.appendChild(cd);
  box.appendChild(priceEl(it));
  if(it.wash) box.appendChild(el("span","flag","洗い加工が入る生地"));


  const more = el("div","more");
  more.hidden = true;
  more.id = "m" + it.c;
  const left = el("div","more-ph");
  const stage = document.createElement("img");
  stage.className = "stage"; stage.alt = ph.alt; stage.loading = "lazy"; guard(stage); stage.src = src(it.c,"tatami");
  left.appendChild(stage);
  const t = thumbs(it, stage);
  left.appendChild(t.row);
  left.appendChild(t.cap);
  more.appendChild(left);
  const right = el("div","more-tx");
  const mc = el("p","code"); mc.innerHTML = 'ms-<b>' + it.c + '</b>'; if(it.n) mc.appendChild(el("span","cn", it.n)); right.appendChild(mc);
  if(withDesc) right.appendChild(el("p","note", it.d));
  if(it.mk) right.appendChild(el("p","maker", it.mk));
  right.appendChild(specEl(it));
  const cl = el("button","more-close","閉じる"); cl.type = "button"; right.appendChild(cl);
  more.appendChild(right);
  box._more = more;
  box.setAttribute("aria-controls", more.id);

  const setOpen = open=>{
    box.classList.toggle("open", open);
    box.setAttribute("aria-expanded", open ? "true":"false");
    if(open){

      [...box.parentNode.children].forEach(x=>{ if(x !== box && x.classList.contains("card2") && x.classList.contains("open") && Math.abs(x.offsetTop - box.offsetTop) < 4) x._set(false); });
      place(box, more);
      more.hidden = false;
      if(more.getBoundingClientRect().top > innerHeight * 0.55)
        box.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }else{
      more.hidden = true;
      more.remove();
      if(stage.isConnected){ stage.src = src(it.c,"tatami"); stage.classList.remove("kiji"); }
      t.cap.textContent = VIEWS[0][1];
      [...t.row.children].forEach((x,k)=>x.setAttribute("aria-pressed", k===0 ? "true":"false"));
    }
  };
  box._set = setOpen;
  box.addEventListener("click", ()=>setOpen(!box.classList.contains("open")));
  cl.addEventListener("click", ()=>{ setOpen(false); box.focus({preventScroll:true}); });
  return box;
}


const recEl = document.getElementById("recs");
RECS.forEach(c=>{
  let hit=null;
  TABS.forEach((tab,ti)=>tab.groups.forEach(g=>g.items.forEach(it=>{ if(it.c===c) hit={it,tab,ti,g}; })));
  if(!hit) return;
  const a = el("button","rec"); a.type="button";
  const im = document.createElement("img"); im.alt = "ms-" + c + (hit.it.n ? " " + hit.it.n : ""); guard(im); im.src = src(c,"kakudai"); a.appendChild(im);
  const tx = el("div","rec-tx");
  const tg = el("p","rec-tag"); tg.appendChild(el("span","", hit.tab.label)); tg.appendChild(el("span","", hit.g.name || " ")); tx.appendChild(tg);
  const cd = el("p","code"); cd.innerHTML = 'ms-<b>' + c + '</b>'; tx.appendChild(cd);
  tx.appendChild(el("p","color2", hit.it.n));
  const pr = el("p","price", yen(hit.it.pr)); pr.appendChild(el("span","unit","円（税込）〜")); tx.appendChild(pr);
  a.appendChild(tx);
  a.addEventListener("click", ()=>{ select(hit.ti, true); document.getElementById("list-top").scrollIntoView({block:"start"}); });
  recEl.appendChild(a);
});
if(!recEl.children.length) recEl.closest("section").hidden = true;
const hash = (location.hash || "").replace("#","");
const start = Math.max(0, TABS.findIndex(t=>t.id===hash));
select(start, true);
const nav = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {};
if(hash && TABS.some(t=>t.id===hash) && nav.type !== "reload" && nav.type !== "back_forward"){
  const top = document.getElementById("list-top");
  const go = ()=>top.scrollIntoView({block:"start"});
  go();
  let moved = false;
  addEventListener("wheel", ()=>{ moved = true; }, {once:true, passive:true});
  addEventListener("touchstart", ()=>{ moved = true; }, {once:true, passive:true});
  addEventListener("load", ()=>{ if(!moved) go(); });
}
</script>
</body></html>
